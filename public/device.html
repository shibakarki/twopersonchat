<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device - Light Bulb</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-container">
    <div class="header">
      <h1>💡 Light Device</h1>
      <p id="userName" class="user-name"></p>
    </div>

    <div class="content-card">
      <div class="status-indicator" id="statusIndicator">
        <span class="status-dot"></span>
        <span class="status-text">Connecting...</span>
      </div>

      <div class="controller-status" id="controllerStatus">
        <span class="status-icon">🎮</span>
        <span class="status-label">Controller: </span>
        <span class="status-value">Offline</span>
      </div>

      <div class="bulb-section">
        <div class="bulb-container" id="bulbContainer">
          <!-- Light bulb SVG -->
          <svg class="light-bulb" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
            <!-- Bulb glow effect -->
            <defs>
              <radialGradient id="bulbGlow" cx="50%" cy="40%">
                <stop offset="0%" style="stop-color:#fff9e6; stop-opacity:1" id="glowInner"/>
                <stop offset="40%" style="stop-color:#ffd700; stop-opacity:0.6" id="glowMid"/>
                <stop offset="100%" style="stop-color:#ffd700; stop-opacity:0" id="glowOuter"/>
              </radialGradient>
              
              <filter id="glow">
                <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
                <feMerge>
                  <feMergeNode in="coloredBlur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <!-- Glow circle (appears when light is on) -->
            <circle id="glowCircle" cx="100" cy="80" r="70" fill="url(#bulbGlow)" opacity="0" filter="url(#glow)"/>
            
            <!-- Bulb glass -->
            <path id="bulbGlass" d="M 100 20 
                     Q 130 20, 140 50
                     Q 145 70, 145 90
                     Q 145 120, 130 140
                     L 120 160
                     L 80 160
                     L 70 140
                     Q 55 120, 55 90
                     Q 55 70, 60 50
                     Q 70 20, 100 20 Z"
                  fill="#e0e0e0" 
                  stroke="#666" 
                  stroke-width="2"/>
            
            <!-- Filament -->
            <path id="filament" d="M 90 80 Q 95 90, 100 80 Q 105 70, 110 80 Q 105 90, 100 100 Q 95 90, 90 100" 
                  stroke="#ff6b00" 
                  stroke-width="3" 
                  fill="none" 
                  opacity="0.3"/>
            
            <!-- Base screw threads -->
            <rect x="75" y="160" width="50" height="8" fill="#888" stroke="#555" stroke-width="1"/>
            <rect x="75" y="170" width="50" height="8" fill="#888" stroke="#555" stroke-width="1"/>
            <rect x="75" y="180" width="50" height="8" fill="#888" stroke="#555" stroke-width="1"/>
            <rect x="75" y="190" width="50" height="10" fill="#666" stroke="#444" stroke-width="1"/>
          </svg>
        </div>

        <div class="intensity-readout">
          <div class="readout-label">Current Intensity</div>
          <div class="readout-value" id="currentIntensity">0%</div>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Get user info from URL
    const urlParams = new URLSearchParams(window.location.search);
    const userName = urlParams.get('name') || 'Device';
    const role = urlParams.get('role');

    // Display user name
    document.getElementById('userName').textContent = `Device: ${userName}`;

    // Connect to server
    const socket = io();
    
    const statusIndicator = document.getElementById('statusIndicator');
    const controllerStatus = document.getElementById('controllerStatus');
    const currentIntensity = document.getElementById('currentIntensity');
    const bulbGlass = document.getElementById('bulbGlass');
    const filament = document.getElementById('filament');
    const glowCircle = document.getElementById('glowCircle');

    // Register as device
    socket.on('connect', () => {
      console.log('Connected to server');
      socket.emit('register', { role: 'device', name: userName });
      updateStatus('connected');
    });

    // Receive intensity changes
    socket.on('intensityChange', (data) => {
      const intensity = data.intensity;
      updateBulb(intensity);
    });

    // Controller status updates
    socket.on('controllerStatus', (data) => {
      updateControllerStatus(data.online);
    });

    // Update bulb appearance based on intensity
    function updateBulb(intensity) {
      currentIntensity.textContent = `${intensity}%`;
      
      // Normalize intensity (0-1)
      const normalized = intensity / 100;
      
      // Update bulb glass color (from gray to bright yellow)
      const r = Math.round(224 + (255 - 224) * normalized);
      const g = Math.round(224 + (215 - 224) * normalized);
      const b = Math.round(224 + (0 - 224) * normalized);
      bulbGlass.setAttribute('fill', `rgb(${r}, ${g}, ${b})`);
      
      // Update filament opacity (glows brighter)
      filament.setAttribute('opacity', 0.3 + (normalized * 0.7));
      
      // Update glow circle
      glowCircle.setAttribute('opacity', normalized * 0.8);
      glowCircle.setAttribute('r', 70 + (normalized * 30));
      
      // Add pulsing effect at high intensity
      if (intensity > 80) {
        glowCircle.style.animation = 'pulse 2s ease-in-out infinite';
      } else {
        glowCircle.style.animation = 'none';
      }
    }

    // Handle disconnection
    socket.on('disconnect', () => {
      console.log('Disconnected from server');
      updateStatus('disconnected');
    });

    socket.on('disconnected', (data) => {
      alert(data.message);
      window.location.href = 'index.html';
    });

    // Update status indicator
    function updateStatus(status) {
      const statusText = statusIndicator.querySelector('.status-text');
      statusIndicator.className = 'status-indicator';
      
      if (status === 'connected') {
        statusIndicator.classList.add('connected');
        statusText.textContent = 'Connected';
      } else if (status === 'disconnected') {
        statusIndicator.classList.add('disconnected');
        statusText.textContent = 'Disconnected';
      }
    }

    // Update controller status
    function updateControllerStatus(online) {
      const statusValue = controllerStatus.querySelector('.status-value');
      controllerStatus.className = 'controller-status';
      
      if (online) {
        controllerStatus.classList.add('online');
        statusValue.textContent = 'Online';
      } else {
        controllerStatus.classList.add('offline');
        statusValue.textContent = 'Offline';
      }
    }

    // Add CSS animation for pulse
    const style = document.createElement('style');
    style.textContent = `
      @keyframes pulse {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.1); }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
