<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sender</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h2>Sender</h2>
  <div id="loginDiv">
    <input type="text" id="nameInput" placeholder="Enter your name">
    <button id="joinBtn">Join</button>
  </div>

  <div id="controls" style="display:none;">
    <video id="localVideo" autoplay muted width="300"></video>

    <div class="sender-controls">
      <label>Send Camera<input type="checkbox" id="cameraToggle" checked></label>
      <label>Send Location<input type="checkbox" id="locationToggle" checked></label>
      <label>Send Speed<input type="checkbox" id="speedToggle" checked></label>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="sender.js"></script>
</body>
</html>
