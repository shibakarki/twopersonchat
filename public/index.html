<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta-name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Sender Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="login-container">
        <h2>Enter your name to join</h2>
        <input id="username-input" type="text" placeholder="Your name..." autocomplete="off">
        <button id="join-btn">Join Chat</button>
    </div>

    <!-- CHAT SCREEN -->
    <div id="chat-screen" class="chat-container" style="display:none;">
        <div class="top-bar">
            <h3 id="user-role-display"></h3>
        </div>

        <ul id="messages"></ul>

        <form id="chat-form">
            <input id="message-input" autocomplete="off" placeholder="Type a message..." />
            <button type="submit">Send</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
