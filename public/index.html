<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Sender System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container" id="loginContainer">
    <h1>Welcome</h1>
    <p>Enter your name to start:</p>
    <input type="text" id="nameInput" placeholder="Your name">
    <button id="joinBtn">Join</button>
</div>

<script>
document.getElementById('joinBtn').onclick = () => {
    const name = document.getElementById('nameInput').value.trim();
    if (!name) return alert('Please enter your name');

    // Assign role based on name
    let role = (name.toLowerCase() === 'shiba karki') ? 'receiver' : 'sender';

    // Redirect with name and role as query params
    window.location.href = `${role}.html?name=${encodeURIComponent(name)}`;
};
</script>
</body>
</html>
